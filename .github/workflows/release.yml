name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit belongs to main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Release tag commit is not reachable from main"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: pnpm verify:release-tag

      - name: Run source gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm test
          pnpm supply-chain:check
          pnpm audit --audit-level high

      - name: Build release archive
        run: pnpm build:theme

      - name: Verify reproducible archive
        env:
          ARCHIVE: artifacts/komarima-${{ github.ref_name }}.zip
        run: |
          first_digest="$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)"
          pnpm build:theme
          second_digest="$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)"
          test "$first_digest" = "$second_digest"

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test production bundle
        env:
          PLAYWRIGHT_SERVER_COMMAND: pnpm exec vite preview --host 127.0.0.1 --port 4173
        run: pnpm exec playwright test tests/e2e/app.spec.ts tests/e2e/accessibility.spec.ts tests/e2e/ui-polish.spec.ts --project=chromium --workers=1

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            artifacts/komarima-${{ github.ref_name }}.zip
            artifacts/komarima-${{ github.ref_name }}.zip.sha256
            sbom.cdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  visual:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit belongs to main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Release tag commit is not reachable from main"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: pnpm verify:release-tag

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Visual regression tests
        run: pnpm exec playwright test tests/e2e/visual.spec.ts --project=chromium --workers=1

  publish:
    needs: [build, visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Verify archive checksum
        working-directory: release-assets/artifacts
        run: sha256sum --check "komarima-${{ github.ref_name }}.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "release-assets/artifacts/komarima-${{ github.ref_name }}.zip"
          --generate-notes
          --repo "${{ github.repository }}"
          --title "Komarima ${{ github.ref_name }}"
          --verify-tag
